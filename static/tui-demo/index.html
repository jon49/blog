<html lang="en">
<head>

<title>Terminal console tour</title>
<meta name="description" content="A made-up, keyboard-driven copy of a terminal client for Claude Code sessions, with an explanation of each screen.">
<style>

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15161a;--panel:#1e1f24;--sunk:#26272d;--ink:#ecebe7;--muted:#c3c0b8;--line:#3b3c43;--link:#9cc3ef;--focus:#9cc3ef;

  --t-blue:#a9c8f5;--t-cyan:#8fd9e6;--t-violet:#d0b4f5;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#15161a;--panel:#1e1f24;--sunk:#26272d;--ink:#ecebe7;--muted:#c3c0b8;--line:#3b3c43;--link:#9cc3ef;--focus:#9cc3ef;

  --t-blue:#a9c8f5;--t-cyan:#8fd9e6;--t-violet:#d0b4f5;

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:0.9375rem/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;overflow:hidden}
a{color:var(--link);text-underline-offset:2px}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:3px}
code{font-family:Consolas,"Cascadia Mono",Menlo,monospace;font-size:0.85em;background:var(--sunk);padding:0.05em 0.3em;border-radius:3px;overflow-wrap:anywhere}
p{margin:0.35rem 0}

.shell{height:100vh;display:grid;grid-template-columns:minmax(0,1fr) 22rem}
.app-col{display:flex;flex-direction:column;min-width:0;min-height:0;border-right:1px solid var(--line);padding:0.7rem 0.8rem 0.6rem;gap:0.45rem}
@media (max-width:979px){
  .shell{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
  .app-col{border-right:0;border-bottom:2px solid var(--line);padding:0.5rem}
  #panel{max-height:42vh}
  #panel.closed{max-height:none}
  #panel.closed .pbody{display:none}
}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:0.3rem 0.8rem;font-size:0.85rem;color:var(--muted)}
.bar .spacer{flex:1}
.kbd{font-weight:600;color:var(--ink)}
.iconbtn{border:1px solid var(--line);background:transparent;border-radius:6px;padding:0.1rem 0.55rem;cursor:pointer;font-size:0.82rem}

/* the terminal */
.frame{flex:1;min-height:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--t-bg)}
.frame.bell{animation:bell 0.6s ease-out 1}
@keyframes bell{0%{box-shadow:0 0 0 4px var(--t-red)}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.frame.bell{animation:none;outline:3px solid var(--t-red)}}
.tbar{display:flex;align-items:center;gap:0.4rem;padding:0.25rem 0.6rem;background:var(--sunk);border-bottom:1px solid var(--line);font-size:0.78rem;color:var(--muted)}
.tbar i{width:0.65rem;height:0.65rem;border-radius:50%;border:1px solid var(--muted);display:inline-block}
.tbar span{margin-left:0.4rem}
#term{flex:1;min-height:0;overflow:hidden;background:var(--t-bg);color:var(--t-ink);font-family:Consolas,"Cascadia Mono","DejaVu Sans Mono",Menlo,monospace;font-size:14px;line-height:1.35;padding:0.35rem 0.4rem;cursor:default;outline:none}
#term.narrow{overflow:auto}
#term:focus-visible{outline:3px solid var(--focus);outline-offset:-3px}
#term .ln{white-space:pre;height:1.35em}
#term .ln.click{cursor:pointer}
#term .sel{background:var(--t-sel)}
#term .g{display:inline-block;width:1ch;text-align:center;overflow:visible}
#term .cur{background:var(--t-ink);color:var(--t-bg)}
#term [data-key]{cursor:pointer}
.c-key,.c-info{color:var(--t-cyan)}
.c-accent{font-weight:700;text-decoration:underline;text-underline-offset:2px}
.c-alert{color:var(--t-red);font-weight:700}
.c-flash{background:var(--t-red);color:var(--t-bg);font-weight:700}
.c-warn{color:var(--t-yellow);font-weight:700}
.c-dim{color:var(--t-dim)}
.c-error{background:var(--t-red);color:var(--t-bg);font-weight:700}
.c-bold{font-weight:700}
.c-ok{color:var(--t-green);font-weight:700}
.c-idle{color:var(--t-blue);font-weight:700}
.c-bg{color:var(--t-violet)}
.c-timer{color:var(--t-violet);font-weight:700}
.c-heading{font-weight:700}
.c-tmux{background:var(--t-green);color:var(--t-bg)}
.c-claude{color:var(--t-violet)}
.c-plain{}

.keys{display:flex;flex-wrap:wrap;gap:0.3rem}
.keys button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:0.15rem 0.55rem;cursor:pointer;font:0.82rem Consolas,"Cascadia Mono",Menlo,monospace;min-width:2.2rem}
.keys button span{font:0.75rem "Segoe UI",system-ui,sans-serif;color:var(--muted);margin-left:0.3rem}

/* explanation panel */
#panel{background:var(--panel);overflow:auto;min-height:0;display:flex;flex-direction:column}
.phead{display:flex;align-items:center;gap:0.5rem;padding:0.6rem 1rem;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel)}
.phead .k{font-size:0.72rem;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:var(--muted)}
.phead .spacer{flex:1}
.toggle{display:none}
@media (max-width:979px){.toggle{display:inline-block}}
.pbody{padding:0.6rem 1rem 1.2rem}
.pbody h2{border:0;margin:0.1rem 0 0.5rem;padding:0;font-size:1.12rem}
.pbody h4{font-size:0.74rem;text-transform:uppercase;letter-spacing:0.05em;color:var(--muted);margin:0.8rem 0 0.15rem}
.pbody p{font-size:0.9rem}
.next{margin:1rem 0 0.4rem;padding:0.55rem 0.7rem;background:var(--sunk);border-radius:8px;font-size:0.9rem}
.next a{font-weight:600}
.pbody svg{width:100%;height:auto;margin:0.5rem 0}
.stops{font-size:0.85rem;margin-top:0.8rem;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:0.4rem 0.7rem}
.stops summary{cursor:pointer;font-weight:600}
.stops ol{padding-left:1.4rem;margin:0.3rem 0}
.stops a[aria-current="true"]{font-weight:700;color:var(--ink)}
.seen{font-size:0.78rem;color:var(--muted);margin-top:0.4rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>

const STOPS = ['', 'sessions', 'attach/storefront~2', 'attach/mobile', 'brief/storefront', 'replies/storefront', 'search', 'notices', 'new', 'triage/warehouse', 'coord', 'prs', 'flash', 'help'];
const panelOfHash = (h) => {
  if (h === '') return 'welcome';
  const [a, b] = h.split('/');
  if (a === 'attach') return b === 'storefront~2' ? 'attach-permission' : b === 'mobile' ? 'attach-question' : 'attach';
  return PANELS[a] ? a : 'welcome';
};
const state = { hash: '', seen: new Set([]), panelOpen: true, embedded: false };
function contextHash() {
  if (M.attached) {
    const a = M.attached.agent;
    return 'attach/' + a;
  }
  if (M.screen === 'brief' || M.screen === 'replies') return M.screen + '/' + M.agent;
  if (M.screen === 'sessions') return M.search !== null ? 'search' : (['', 'flash'].includes(state.hash) ? state.hash : 'sessions');
  if (M.screen === 'triage') return 'triage/' + PROJECTS[M.proj].key;
  return M.screen;
}
function syncContext() {
  const h = contextHash();

    state.hash = h;
    try { history.replaceState(null, '', h ? '#' + h : location.pathname); } catch (e) { /* sandboxed: hash stays */ }
    renderPanel();
  }
}
function panelNow() {
  if (M.attached && state.hash.startsWith('attach/')) return { permission: 'attach-permission', question: 'attach-question' }[M.attached.kind0] || 'attach';
  return panelOfHash(state.hash);
}
function renderPanel() {
  const key = panelNow();
  state.seen.add(key);
  const p = PANELS[key];
  const stopKeys = STOPS.map(panelOfHash);
  const n = stopKeys.indexOf(key) + 1;
  const stops = STOPS.map((h, i) => `<li><a href="#${h}"${stopKeys[i] === key ? ' aria-current="true"' : ''}>${PANELS[stopKeys[i]].title}</a>${state.seen.has(stopKeys[i]) && stopKeys[i] !== key ? ' ✓' : ''}</li>`).join('');
  const seenN = stopKeys.filter((k) => state.seen.has(k)).length;
  const el = document.getElementById('panel');
  el.innerHTML = `<div class="phead"><span class="k">${n ? `Stop ${n} of ${STOPS.length}` : 'Exploring'}</span><span class="spacer"></span>
    ${state.embedded ? `<a href="${location.pathname}#${state.hash}" target="_blank" rel="noopener">Full screen ↗</a>` : ''}
    <button class="iconbtn toggle" data-act="panel" aria-expanded="${state.panelOpen}">${state.panelOpen ? 'Hide' : 'Explain'}</button></div>
    <div class="pbody"><h2>${p.title}</h2>
    <h4>In my day</h4><p>${p.day}</p>
    <h4>How it’s built</h4><p>${p.built}</p>
    <p class="next">Try next: <a href="#${p.next}">${p.nextLabel} →</a></p>
    <details class="stops"><summary>All stops</summary><ol>${stops}</ol></details>
    <p class="seen">${seenN} of ${STOPS.length} seen</p></div>`;

}
function goStop(hash) {
  hash = String(hash || '').replace(/^#/, '');
  try { hash = decodeURIComponent(hash); } catch (e) { /* keep */ }
  const [a, b] = hash.split('/');
  const fresh = seedSessions();
  M.attached = null; M.confirm = null; M.form = null; M.statusUntil = 0; M.search = null; M.typing = false;
  if (a === 'attach' && S[b] && fresh[b]) {
    S[b] = fresh[b]; M.screen = 'sessions'; keepSel(); M.selKey = b; keepSel(); attach(b);
  } else if ((a === 'brief' || a === 'replies') && sessOf(b)) {
    M.prev = 'sessions'; M.screen = a; M.agent = b; M.scroll = 0;
  } else if (a === 'search') {
    M.screen = 'sessions'; M.search = 'gift'; M.typing = true; M.ended = Object.assign({}, OLDER); select(0);
  } else if (a === 'notices' || a === 'coord' || a === 'prs' || a === 'help') {
    if (a === 'notices') M.dismissed.clear();
    if (a === 'help') { M.prev = 'sessions'; M.screen = 'help'; } else { goScreen(a); M.screen = a; M.sel = 0; M.selKey = null; keepSel(); }
  } else if (a === 'new') {
    M.dismissed.delete('n1'); M.screen = 'notices'; openForm({ project: 'storefront', prompt: NOTICES_SEED[0].prompt, notice: 'n1' });
  } else if (a === 'triage') {
    const i = PROJECTS.findIndex((p) => p.key === b); M.screen = 'triage'; M.proj = i < 0 ? 0 : i; M.triSel = 0;
  } else if (a === 'flash') {
    M.screen = 'sessions'; M.sel = 0; M.selKey = null;

    setTimeout(() => { triggerWarehouse(); render(); }, 900);
  } else {
    M.screen = 'sessions'; M.selKey = 'storefront~2'; hash = a === 'sessions' ? 'sessions' : '';
  }
  state.hash = M.attached || ['brief', 'replies', 'triage'].includes(M.screen) ? contextHash() : (STOPS.includes(hash) ? hash : '');

  render();
}
function triggerWarehouse() {
  const w = S.warehouse;

  M.flashed = true;
  Object.assign(w, { state: 'permission', since: now(), kind: 'permission', last: 'Bash: npm run print-preview',
    cmd: ['npm run print-preview -- --aisle 4', 'Print a preview of aisle 4\'s pick list'],
    lead: 'The aisle headings are in. I\'ll print a preview to check the layout.' });

/* ---------------- input ---------------- */
function keyFromEvent(e) {
  if (e.metaKey) return null;
  if (e.ctrlKey && !e.altKey) {
    const k = e.key.toLowerCase();
    return ['h', 'l', 'o', 'j'].includes(k) ? 'C-' + k : null;
  }
  const map = { ArrowUp: 'Up', ArrowDown: 'Down', ArrowLeft: 'Left', ArrowRight: 'Right', PageUp: 'PgUp', PageDown: 'PgDn', Home: 'Home', End: 'End', Escape: 'Esc', Backspace: 'Backspace' };
  if (map[e.key]) return map[e.key];
  if (e.key === 'Enter') return e.altKey || e.shiftKey ? 'M-Enter' : 'Enter';
  if (e.key === 'Tab') return e.shiftKey ? null : 'Tab';
  if (/^F[1-5]$/.test(e.key)) return e.key;
  if (e.key.length === 1 && !e.altKey) return e.key;
  return null;
}
const term = document.getElementById('term');
term.addEventListener('keydown', (e) => {
  const k = keyFromEvent(e);
  if (!k) return;
  if (k === 'Tab' && !(M.attached && M.attached.kind === 'prompt')) return; // let Tab leave the terminal
  e.preventDefault();
  key(k);
  render();
});
term.addEventListener('paste', (e) => {
  e.preventDefault();
  const text = (e.clipboardData || window.clipboardData).getData('text');
  if (M.screen === 'new' && M.form && M.form.step === 'text') M.form.value += text;
  else if (M.attached && M.attached.kind === 'prompt') M.attached.input += text;
  else if (M.screen === 'sessions' && M.typing) { M.search += text.split(/\s+/).join(' '); select(0); }
  else say('Ignored a paste: attach to the session (Enter) and paste there', 3);
  render();
});
term.addEventListener('focus', () => { document.getElementById('kbhint').innerHTML = '<span class="kbd">Keyboard is on.</span> Keys go to the terminal. Tab moves on.'; });
term.addEventListener('blur', () => { document.getElementById('kbhint').textContent = 'Click the terminal, then use your keyboard, or the keys below it.'; });
term.addEventListener('pointerdown', (e) => {
  if (e.button !== 0) return;
  e.preventDefault();
  term.focus({ preventScroll: true });
  const kEl = e.target.closest('[data-key]');
  if (kEl) { key(kEl.dataset.key); render(); return; }
  const ln = e.target.closest('.ln');
  if (!ln) return;
  const L = LINES[+ln.dataset.i];
  if (!L || !L.click) return;
  const c = L.click;
  if (c.list !== undefined) { if (M.sel === c.list) key('Enter'); else select(c.list); }
  else if (c.tri !== undefined) { if (M.triSel === c.tri) triageKey('Enter'); else M.triSel = c.tri; }
  else if (c.form !== undefined) { if (M.form.sel === c.form) formKey('Enter'); else M.form.sel = c.form; }
  render();
});
document.getElementById('keys').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-k]');
  if (!b) return;
  key(b.dataset.k);
  render();
});
document.addEventListener('click', (e) => {
  const a = e.target.closest('#panel a[href^="#"]');
  if (a) {
    e.preventDefault();
    const h = a.getAttribute('href').slice(1);
    if (!state.embedded) history.pushState(null, '', h ? '#' + h : location.pathname);
    goStop(h);
    return;
  }
  const t = e.target.closest('[data-act="panel"]');
  if (t) { state.panelOpen = !state.panelOpen; renderPanel(); }

function isDark() {
  const t = document.documentElement.dataset.theme;
  return t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
}
function themeLabel() { document.getElementById('theme').textContent = isDark() ? 'Light' : 'Dark'; }
document.getElementById('theme').addEventListener('click', () => { document.documentElement.dataset.theme = isDark() ? 'light' : 'dark'; themeLabel(); });

window.addEventListener('hashchange', () => goStop(location.hash));
let lastBox = '';
new ResizeObserver(() => {

  if (box === lastBox) return;
  lastBox = box; measure(); render();

try { state.embedded = window.top !== window; } catch (e) { state.embedded = true; }
themeLabel();
measure();
goStop(location.hash);
setInterval(render, 500);
setTimeout(() => { if (!M.flashed && S.warehouse && S.warehouse.state === 'working' && !M.attached) triggerWarehouse(); }, 60000);
