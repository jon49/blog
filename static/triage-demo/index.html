<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Triage app tour</title>
<meta name="description" content="A clickable, made-up copy of a local work-triage app and Claude Code session console, with an explanation of each screen.">
<style>
:root{
  --bg:#f6f5f1;--panel:#ffffff;--sunk:#ebe9e3;--ink:#1a1a18;--muted:#45433e;--line:#d3d0c7;--link:#1a4a80;--focus:#1a4a80;
  --red:#8a1c14;--red-bg:#fbe9e7;--amber:#6b3d00;--amber-bg:#fff1d6;--green:#1b5527;--green-bg:#e3f2e6;
  --blue:#1a4a80;--blue-bg:#e6eef8;--violet:#5a2d8c;--violet-bg:#f1eaf9;--term:#16171a;--term-ink:#e8e6e1;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15161a;--panel:#1e1f24;--sunk:#26272d;--ink:#ecebe7;--muted:#c3c0b8;--line:#3b3c43;--link:#9cc3ef;--focus:#9cc3ef;
  --red:#ffb4aa;--red-bg:#3a1d1a;--amber:#f5c77e;--amber-bg:#33270f;--green:#9fdcaa;--green-bg:#18301e;
  --blue:#9cc3ef;--blue-bg:#1b2838;--violet:#d0b4f5;--violet-bg:#2b2238;--term:#0d0e10;--term-ink:#e8e6e1;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#15161a;--panel:#1e1f24;--sunk:#26272d;--ink:#ecebe7;--muted:#c3c0b8;--line:#3b3c43;--link:#9cc3ef;--focus:#9cc3ef;
  --red:#ffb4aa;--red-bg:#3a1d1a;--amber:#f5c77e;--amber-bg:#33270f;--green:#9fdcaa;--green-bg:#18301e;
  --blue:#9cc3ef;--blue-bg:#1b2838;--violet:#d0b4f5;--violet-bg:#2b2238;--term:#0d0e10;--term-ink:#e8e6e1;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:0.9375rem/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;overflow:hidden}
a{color:var(--link);text-underline-offset:2px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:3px}
code{font-family:Consolas,"Cascadia Mono",Menlo,monospace;font-size:0.85em;background:var(--sunk);padding:0.05em 0.3em;border-radius:3px;overflow-wrap:anywhere}
h1{font-size:1.35rem;margin:0 0 0.2rem}
h2{font-size:1.08rem;margin:1.6rem 0 0.5rem;padding-bottom:0.25rem;border-bottom:2px solid var(--line)}
h3{font-size:0.98rem;margin:0}
p{margin:0.35rem 0}

.shell{height:100vh;display:grid;grid-template-columns:minmax(0,1fr) 22rem}
.app-col{display:flex;flex-direction:column;min-width:0;min-height:0;border-right:1px solid var(--line)}
#app{flex:1;overflow:auto;padding:1rem 1.1rem 3rem;min-width:0}
@media (max-width:979px){
  .shell{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
  .app-col{border-right:0;border-bottom:2px solid var(--line)}
  #panel{max-height:42vh}
  #panel.closed{max-height:none}
  #panel.closed .pbody{display:none}
  #app{padding:0.8rem 0.75rem 2rem}
}

/* top bar */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:0.35rem 0.9rem;padding:0.5rem 1rem;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{font-weight:700;display:flex;align-items:center;gap:0.4rem;margin-right:0.3rem}
.brand svg{width:1.2rem;height:1.2rem}
.nav{display:flex;gap:0.2rem}
.nav a{padding:0.25rem 0.6rem;border-radius:6px;text-decoration:none;color:var(--ink)}
.nav a[aria-current="page"]{background:var(--sunk);font-weight:600}
.badge{display:inline-block;min-width:1.2rem;padding:0 0.35rem;border-radius:0.6rem;background:var(--red-bg);color:var(--red);font-size:0.75rem;font-weight:700;text-align:center;margin-left:0.25rem}
.spacer{flex:1}
.chip{border:1px solid var(--line);background:var(--sunk);border-radius:1rem;padding:0.15rem 0.7rem;font-size:0.82rem;cursor:pointer}
.chip.off{background:transparent}
.iconbtn{border:1px solid var(--line);background:transparent;border-radius:6px;padding:0.15rem 0.55rem;cursor:pointer;font-size:0.82rem}

/* triage page */
.tabs{display:flex;flex-wrap:wrap;gap:0.3rem;margin:0 0 0.9rem}
.tabs a{padding:0.3rem 0.75rem;border:1px solid var(--line);border-radius:6px;text-decoration:none;color:var(--ink);background:var(--panel)}
.tabs a[aria-current="page"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sub{color:var(--muted);margin:0 0 0.6rem;font-size:0.88rem}
.intro{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:0.6rem 0.8rem;margin:0.6rem 0}
.wrap{overflow-x:auto;max-width:100%}
table{width:100%;border-collapse:collapse;font-size:0.86rem}
th,td{text-align:left;vertical-align:top;padding:0.3rem 0.45rem;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-size:0.72rem;text-transform:uppercase;letter-spacing:0.03em;font-weight:600}
td.id{white-space:nowrap}
.wi{color:var(--link);text-decoration:underline;text-underline-offset:2px;white-space:nowrap}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:0.7rem 0.85rem;margin:0.7rem 0;scroll-margin-top:1rem}
.card header{display:flex;flex-wrap:wrap;gap:0.4rem 0.6rem;align-items:center;margin-bottom:0.3rem}
.card .why{color:var(--muted);margin:0.1rem 0 0.5rem;font-size:0.88rem}
.copy{margin-left:auto;border:1px solid var(--line);background:var(--sunk);border-radius:6px;padding:0.1rem 0.55rem;font-size:0.78rem;cursor:pointer}
.tag{display:inline-block;font-size:0.72rem;font-weight:700;padding:0.05rem 0.5rem;border-radius:0.7rem;white-space:nowrap}
.t0{color:var(--red);background:var(--red-bg)}.tA{color:var(--violet);background:var(--violet-bg)}.tC{color:var(--blue);background:var(--blue-bg)}
.st{display:inline-block;font-size:0.72rem;font-weight:600;padding:0.02rem 0.45rem;border-radius:0.6rem;white-space:nowrap}
.st-QA{color:var(--blue);background:var(--blue-bg)}.st-InProgress{color:var(--green);background:var(--green-bg)}
.st-Approved{color:var(--ink);background:var(--sunk)}.st-Blocked{color:var(--red);background:var(--red-bg)}
.banner{background:var(--red-bg);color:var(--red);border-radius:6px;padding:0.35rem 0.6rem;font-weight:600;margin:0.2rem 0 0.5rem;font-size:0.86rem}
.box{border-radius:8px;padding:0.6rem 0.8rem;margin:0.7rem 0;border:1px solid var(--line);background:var(--panel)}
.box.red{border:2px solid var(--red);background:var(--red-bg)}
.box.red h3{color:var(--red)}
.qh{font-size:0.9rem;margin:0.8rem 0 0.3rem}
.wait{color:var(--amber);background:var(--amber-bg);border-radius:6px;padding:0.2rem 0.5rem;font-size:0.84rem;margin:0.3rem 0 0}
details{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:0.5rem 0.8rem;margin:0.6rem 0}
summary{cursor:pointer;font-weight:600}
ul,ol{padding-left:1.2rem;margin:0.3rem 0}
.hl{animation:hl 1.6s ease-out 1}
@keyframes hl{0%{box-shadow:0 0 0 4px var(--focus)}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.hl{animation:none;outline:3px solid var(--focus)}}

/* sessions */
.notices{display:flex;flex-direction:column;gap:0.35rem;margin:0 0 0.8rem}
.notice{display:flex;align-items:flex-start;gap:0.5rem;background:var(--amber-bg);color:var(--amber);border-radius:8px;padding:0.4rem 0.6rem;font-size:0.86rem}
.notice button.open{flex:1;text-align:left;background:none;border:0;color:inherit;cursor:pointer;padding:0}
.notice .x{background:none;border:0;color:inherit;cursor:pointer;font-size:1rem;line-height:1}
.cols{display:grid;grid-template-columns:15.5rem minmax(0,1fr);gap:0.9rem;align-items:start}
@media (max-width:720px){.cols{grid-template-columns:minmax(0,1fr)}}
.slist h3{font-size:0.75rem;text-transform:uppercase;letter-spacing:0.04em;color:var(--muted);margin:0.7rem 0 0.3rem}
.slist h3:first-child{margin-top:0}
.scard{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:0.4rem 0.55rem;margin:0 0 0.35rem;cursor:pointer}
.scard[aria-current="true"]{border:2px solid var(--focus)}
.scard b{display:block;font-size:0.88rem}
.scard span{display:block;font-size:0.78rem;color:var(--muted)}
.scard .state{display:inline-block;font-size:0.7rem}
.state{display:inline-block;font-size:0.7rem;font-weight:700;border-radius:0.6rem;padding:0 0.45rem;margin-left:0.3rem;vertical-align:1px}
.s-permission,.s-question{color:var(--red);background:var(--red-bg)}
.s-your_turn{color:var(--violet);background:var(--violet-bg)}
.s-working,.s-background{color:var(--green);background:var(--green-bg)}
.s-ended{color:var(--muted);background:var(--sunk)}
.newbtn{display:block;width:100%;margin:0 0 0.6rem;padding:0.4rem;border:1px dashed var(--line);border-radius:8px;background:transparent;cursor:pointer;font-weight:600}
.detail{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:0.75rem 0.9rem;min-width:0}
.facts{display:flex;flex-wrap:wrap;gap:0.2rem 0.9rem;font-size:0.82rem;color:var(--muted);margin:0.2rem 0 0.6rem}
.brief{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,15rem);gap:0.8rem;margin:0.4rem 0 0.7rem}
@media (max-width:1100px){.brief{grid-template-columns:minmax(0,1fr)}}
.brief svg{width:100%;height:auto;background:var(--sunk);border-radius:8px}
.plan{list-style:none;padding:0;margin:0.4rem 0 0}
.plan li{font-size:0.85rem;padding-left:1.3rem;position:relative;margin:0.15rem 0}
.plan li::before{position:absolute;left:0;font-weight:700}
.plan .done{color:var(--muted)}.plan .done::before{content:"✓";color:var(--green)}
.plan .now{font-weight:600}.plan .now::before{content:"▶";color:var(--violet)}
.plan .todo::before{content:"○";color:var(--muted)}
.reply{border:1px solid var(--line);border-radius:8px;padding:0.6rem 0.75rem;background:var(--bg);margin:0.5rem 0}
.reply .rh{display:flex;flex-wrap:wrap;gap:0.4rem;align-items:center;font-size:0.8rem;color:var(--muted);margin-bottom:0.3rem}
.reply .rh .spacer{flex:1}
.reply table{margin:0.4rem 0}
.term{background:var(--term);color:var(--term-ink);font:0.78rem/1.45 Consolas,"Cascadia Mono",Menlo,monospace;border-radius:6px;padding:0.6rem;white-space:pre-wrap;overflow-wrap:anywhere;margin:0.4rem 0 0}
.typebox{display:flex;flex-wrap:wrap;gap:0.4rem;margin-top:0.6rem}
.typebox textarea{flex:1 1 14rem;min-height:2.4rem;border:1px solid var(--line);border-radius:6px;padding:0.35rem 0.5rem;background:var(--bg)}
.keys{display:flex;flex-wrap:wrap;gap:0.3rem;margin-top:0.4rem}
.btn{border:1px solid var(--line);background:var(--sunk);border-radius:6px;padding:0.2rem 0.65rem;cursor:pointer;font-size:0.84rem}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
.overlay{border:2px solid var(--focus);border-radius:10px;background:var(--panel);padding:0.8rem 1rem;margin:0 0 0.9rem}
.field{margin:0.5rem 0}
.field label{display:block;font-size:0.8rem;font-weight:600;color:var(--muted);margin-bottom:0.15rem}
.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:6px;padding:0.3rem 0.45rem;background:var(--bg)}
.radios{display:flex;flex-wrap:wrap;gap:0.3rem 0.9rem;font-size:0.88rem}
.settings{max-width:34rem}
.settings .row{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:0.7rem 0.85rem;margin:0.6rem 0}

/* explanation panel */
#panel{background:var(--panel);overflow:auto;min-height:0;display:flex;flex-direction:column}
.phead{display:flex;align-items:center;gap:0.5rem;padding:0.6rem 1rem;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel)}
.phead .k{font-size:0.72rem;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:var(--muted)}
.phead .spacer{flex:1}
.toggle{display:none}
@media (max-width:979px){.toggle{display:inline-block}}
.pbody{padding:0.6rem 1rem 1.2rem}
.pbody h2{border:0;margin:0.1rem 0 0.5rem;padding:0;font-size:1.12rem}
.pbody h4{font-size:0.74rem;text-transform:uppercase;letter-spacing:0.05em;color:var(--muted);margin:0.8rem 0 0.15rem}
.pbody p{font-size:0.9rem}
.next{margin:1rem 0 0.4rem;padding:0.55rem 0.7rem;background:var(--sunk);border-radius:8px;font-size:0.9rem}
.next a{font-weight:600}
.pbody svg{width:100%;height:auto;margin:0.5rem 0}
.stops{font-size:0.85rem;margin-top:0.8rem}
.stops ol{padding-left:1.4rem}
.stops a[aria-current="true"]{font-weight:700;color:var(--ink)}
.seen{font-size:0.78rem;color:var(--muted);margin-top:0.4rem}

#toast{position:fixed;left:50%;bottom:1rem;transform:translateX(-50%);max-width:min(30rem,calc(100vw - 2rem));background:var(--ink);color:var(--bg);padding:0.5rem 0.85rem;border-radius:8px;font-size:0.86rem;box-shadow:0 4px 16px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div class="shell">
  <div class="app-col">
    <div class="top" id="top"></div>
    <main id="app" tabindex="-1"></main>
  </div>
  <aside id="panel" aria-label="What you are looking at"></aside>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
"use strict";
const CONTRAST = {
  text: ['--ink', '--muted', '--link'],
  surfaces: ['--bg', '--panel', '--sunk'],
  pairs: [['--red', '--red-bg'], ['--amber', '--amber-bg'], ['--green', '--green-bg'], ['--blue', '--blue-bg'],
          ['--violet', '--violet-bg'], ['--ink', '--sunk'], ['--bg', '--ink'], ['--term-ink', '--term'], ['--muted', '--sunk']],
};
window.CONTRAST = CONTRAST;

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const wi = (id) => `<span class="wi">#${id}</span>`;
const linkIds = (s) => s.replace(/#(\d{4})\b/g, (_, id) => wi(id));
const PORT = 'http://localhost:8765';

/* ---------------- invented data ---------------- */
const DATA = {
  projects: {
    storefront: {
      name: 'Storefront', sprint: 'Sprint 22 (Nov 10 → Nov 21, day 4)', synced: 'synced 2 minutes ago',
      intro: 'The web shop. Priya owns the stories; Marco tests. Ship gift cards before the holiday sale on Nov 24.',
      tiers: [
        { tag: '0', cls: 't0', name: 'Priority 0: unblock (QA, reviews and answers that need you)', cards: [
          { slug: 'qa-handoff', title: 'Your QA work: 2 items in QA', why: 'The last sweep closed two items. These two are still with you.', items: [
            [4203, 'Order confirmation email shows the wrong delivery date', 'QA', 'With Marco: test guide, test order and 3 marked-up screenshots posted.'],
            [4206, 'Search ignores accents (café / cafe)', 'QA', 'Every AC is carried by a named test. Waiting on your go to close it.'],
          ] },
        ] },
        { tag: 'A', cls: 'tA', name: 'Priority A: Priya’s stories', cards: [
          { slug: 'gift-cards', title: 'Gift cards and discount codes', why: 'All three touch <code>CheckoutTotals</code> and the same two tables, so one session carries the context. Do #4214 first: the other two build on its order of operations.', items: [
            [4214, 'Gift cards can’t be combined with a discount code', 'In Progress', '<code>storefront~2</code> is on it. Unit tests green; E2E next.'],
            [4215, 'Show the remaining gift-card balance at checkout', 'Approved', 'Small: one API field plus the summary line.'],
            [4217, 'Refund a gift-card purchase to the card, not to cash', 'Blocked', 'Waiting on Priya (see below).'],
          ] },
          { slug: 'search', title: 'Search: speed and spelling', why: 'Both change the search service. #4222 needs the new index from #4221, so keep the order.', items: [
            [4221, 'Suggest a spelling when a search finds nothing', 'In Progress', '<code>storefront</code> is running the tests.'],
            [4222, 'Search results page loads in under 300 ms', 'Approved', 'Baseline measured last sprint: 640 ms on staging.'],
          ] },
        ] },
        { tag: 'C', cls: 'tC', name: 'Priority C: everything else', cards: [
          { slug: 'checkout-cleanup', title: 'Checkout code: dead code and test gaps', why: 'Safe to do any time; don’t start it while the gift-cards session is open, because it edits the same folder.', items: [
            [4230, 'Remove the old CartSummary component', 'Approved', 'Imported nowhere since the redesign.'],
            [4231, 'Add tests for the tax rounding rules', 'Approved', 'Three known edge cases are listed in the story.'],
          ] },
        ] },
      ],
      grabs: [[4240, 'Wishlist share link expires after 24 hours', 'Sprint 22'], [4241, 'Book covers are missing alt text', 'Backlog']],
      waits: [
        ['Priya', [[4217, 'Should a refunded gift card get a new code, or keep the old one?', 'since Nov 11']]],
        ['Marco', [[4203, 'Needs a test account on staging with a saved address.', 'since Nov 12']]],
      ],
      others: [[4219, 'Rewrite the cart’s price formatting', 'In Progress', 'Sam'], [4225, 'Upgrade the payment provider’s SDK', 'Approved', 'Lee']],
      sweep: { date: 'Nov 12', text: 'Two PRs merged and deployed in build 512; every stage passed. <b>Closed:</b> #4201 and #4205 (database only, every AC carried by a named test that failed before the fix). <b>To Marco with screenshots:</b> #4203. <b>Stays with you:</b> #4206 (needs your go). Every item got a comment.' },
      rules: [
        'Done: every AC is carried by evidence Claude can check itself, and no user can see the change.',
        'To Marco: anything a user can see, with a step-by-step guide, named test data and marked-up screenshots.',
        'Stays with you: a decision, a code change, or a measurement no tester can make.',
        'Check tests by name, never by a total. Match the deployed commit, not the version string.',
      ],
    },
    warehouse: {
      name: 'Warehouse', sprint: 'Sprint 22 (Nov 10 → Nov 21, day 4)', synced: 'synced 2 minutes ago',
      intro: 'The stock and shipping service behind the shop. Priya owns the stories; Lee owns the returns queue.',
      tiers: [
        { tag: 'A', cls: 'tA', name: 'Priority A: Priya’s stories', cards: [
          { slug: 'stock-sync', title: 'Stock levels and reservations', blocked: true, why: 'Both change how stock is counted. Nothing can move until the two answers below come back.', items: [
            [4245, 'Stock levels drift after a partial return', 'Blocked', 'Waiting on Lee: which service owns the returns queue?'],
            [4246, 'Reserve stock when an order is paid, not when it ships', 'Blocked', 'Waiting on Priya: what happens to reserved stock on a failed payment?'],
          ] },
          { slug: 'low-stock-emails', title: 'Low-stock emails', why: '#4250 is a bug in the job that #4251 replaces, so fix it first and keep the fix small.', items: [
            [4250, 'Low-stock email goes out twice', 'In Progress', '<code>warehouse</code> has a PR up. Your turn to read it.'],
            [4251, 'Batch low-stock emails into one daily digest', 'Approved', 'Design agreed with Priya on Nov 10.'],
          ] },
        ] },
      ],
      grabs: [[4253, 'Shipping label PDF cuts off long street names', 'Sprint 22']],
      waits: [
        ['Lee', [[4245, 'Which service owns the returns queue?', 'since Nov 12']]],
        ['Priya', [[4246, 'What happens to reserved stock when a payment fails?', 'since Nov 12']]],
      ],
      others: [[4252, 'Move the nightly stock report to the new scheduler', 'In Progress', 'Lee']],
      sweep: { date: 'Nov 12', text: 'Nothing new in QA since the last sweep. #4244 closed (a log-only change, checked against the deployed build).' },
      rules: ['Same as Storefront, plus: anything that touches stock counts goes to Marco even if no screen changed.'],
    },
    mobile: {
      name: 'Mobile', sprint: 'Sprint 22 (Nov 10 → Nov 21, day 4)', synced: 'synced 2 minutes ago',
      intro: 'The reading app. Priya owns the stories; Marco tests on two phones.',
      orphans: [[4258, 'Dark mode: book covers lose their border', 'Approved', 'Assigned to you this morning']],
      tiers: [
        { tag: 'A', cls: 'tA', name: 'Priority A: Priya’s stories', cards: [
          { slug: 'offline-list', title: 'Offline reading list', why: 'One storage change carries all three. <code>mobile</code> is brainstorming the storage choice with you now.', items: [
            [4255, 'Keep the reading list when the phone is offline', 'In Progress', 'Question waiting for you in the session console.'],
            [4256, 'Sync reading-list changes made offline', 'Approved', 'Depends on #4255’s storage choice.'],
            [4257, 'Show which books are available offline', 'Approved', 'A badge on the cover; screenshots for Marco.'],
          ] },
        ] },
      ],
      grabs: [],
      waits: [],
      others: [[4259, 'Update the app icon for the holiday sale', 'In Progress', 'Sam']],
      sweep: { date: 'Nov 11', text: 'Two items to Marco with screenshots from both phones. Nothing closed: every change was visible to users.' },
      rules: ['Same as Storefront, plus: screenshots from both test phones for anything a user can see.'],
    },
  },
  claims: [
    ['desktop', 'storefront~2', 'E2E for #4214', '10:42', 'warehouse (E2E for #4250)'],
    ['sql:local', 'warehouse', 'Integration tests for #4250', '10:31', '—'],
    ['item:4214', 'storefront~2', 'Building it', '09:58', '—'],
    ['item:4221', 'storefront', 'Building it', '09:20', '—'],
    ['item:4250', 'warehouse', 'Building it', '09:05', '—'],

const ORDER = Object.keys(SCREENS);

function panelHtml(key) {
  const p = SCREENS[key].panel;
  const stopN = ORDER.indexOf(key) + 1;
  const stops = ORDER.map((k) => `<li><a href="#${k}"${k === key ? ' aria-current="true"' : ''}>${SCREENS[k].panel.title}</a>${state.seen.has(k) && k !== key ? ' ✓' : ''}</li>`).join('');
  return `<div class="phead"><span class="k">Stop ${stopN} of ${ORDER.length}</span><span class="spacer"></span>
    ${EMBEDDED ? `<a href="${location.pathname}#${key}" target="_blank" rel="noopener">Full screen ↗</a>` : ''}
    <button class="iconbtn toggle" data-act="panel" aria-expanded="${state.panelOpen}">${state.panelOpen ? 'Hide' : 'Explain'}</button></div>
    <div class="pbody"><h2 tabindex="-1">${p.title}</h2>
    <h4>In my day</h4><p>${p.day}</p>
    <h4>How it’s built</h4><p>${p.built}</p>${p.extra}
    <p class="next">Try next: <a href="#${p.next}">${p.nextLabel} →</a></p>
    <details class="stops"><summary>All stops</summary><ol>${stops}</ol></details>
    <p class="seen">${state.seen.size} of ${ORDER.length} seen</p></div>`;
}

/* ---------------- router ---------------- */
function go(key, fromClick) {
  key = String(key || '').replace(/^#/, '');
  try { key = decodeURIComponent(key); } catch (e) { /* keep as is */ }
  if (!Object.prototype.hasOwnProperty.call(SCREENS, key)) key = '';
  if (key !== 'sessions/new') state.prefill = null;
  state.key = key;
  state.seen.add(key);
  render();
  if (fromClick) {
    const url = key ? '#' + key : location.pathname;
    if (EMBEDDED) history.replaceState(null, '', url);
    else if (location.hash.replace(/^#/, '') !== key) history.pushState(null, '', url);
  }
}
function focusSelector(el) {
  if (!el || el === document.body || !el.matches) return null;
  if (el.id) return '#' + CSS.escape(el.id);
  for (const k of ['act', 'reply', 'key', 'session', 'notice', 'dismiss', 'go', 'copy']) {
    if (el.dataset[k] !== undefined) return `[data-${k}="${CSS.escape(el.dataset[k])}"]`;
  }
  if (el.name) return `[name="${CSS.escape(el.name)}"][value="${CSS.escape(el.value)}"]`;
  const href = el.getAttribute('href');
  if (href) return `a[href="${CSS.escape(href)}"]`;
  return '';
}
// Every render replaces the DOM with innerHTML, so the focused control is gone afterwards.
// Put focus back on its replacement, or on the panel heading, or keyboard users lose their place.
function restoreFocus(sel) {
  if (sel === null) return;
  let el = sel && document.querySelector(sel);
  if (el && el.disabled) el = el.parentElement.querySelector('[data-reply]:not([disabled])');
  if (el) el.focus({ preventScroll: true });
  if (!el || document.activeElement !== el) document.querySelector('#panel h2').focus({ preventScroll: true });
}
function render(keepScroll) {
  const s = SCREENS[state.key];
  const app = document.getElementById('app');
  const y = app.scrollTop;
  const focused = focusSelector(document.activeElement);
  document.getElementById('top').innerHTML = topBar();
  app.innerHTML = s.render();
  const panel = document.getElementById('panel');
  panel.innerHTML = panelHtml(state.key);
  panel.classList.toggle('closed', !state.panelOpen);
  panel.scrollTop = 0;
  const needs = DATA.groups[0][1].filter((a) => ['permission', 'question'].includes(DATA.sessions[a].state)).length;
  document.title = (needs ? `(${needs}) ` : '') + 'Triage app tour';
  if (keepScroll) { app.scrollTop = y; restoreFocus(focused); return; }
  app.scrollTop = 0;
  const target = s.focus && document.querySelector(s.focus);
  if (target) {
    const top = target.getBoundingClientRect().top - app.getBoundingClientRect().top + app.scrollTop - 12;
    app.scrollTop = Math.max(0, top);
    target.classList.add('hl');
  }
  restoreFocus(focused);
}

let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3800);
}

function setTheme(t) {
  if (t === 'system') delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = t;
  render(true);
}

document.addEventListener('click', (e) => {
  const a = e.target.closest('a[href^="#"]');
  if (a) { e.preventDefault(); go(a.getAttribute('href'), true); return; }
  const el = e.target.closest('button, [data-go]');
  if (!el) return;
  const d = el.dataset;
  if (d.go !== undefined) { state.prefill = null; go(d.go, true); return; }
  if (d.toast) { toast(d.toast); return; }
  if (d.copy) {
    const done = () => toast('Copied: ' + d.copy);
    (navigator.clipboard ? navigator.clipboard.writeText(d.copy) : Promise.reject()).then(done, () => toast('Your browser blocked copying. The line is: ' + d.copy));
    return;
  }
  if (d.session) {
    const agent = d.session;
    const t = state.timer;
    if (DATA.sessions[agent].state !== 'ended' && !(t.on && t.agent === agent)) state.timer = { on: true, agent, started: Date.now() };
    go('sessions/' + agent, true);
    return;
  }
  if (d.reply) {
    const agent = document.querySelector('.scard[aria-current="true"]').dataset.session;
    const n = DATA.sessions[agent].replies.length;
    state.replyIdx[agent] = Math.min(n - 1, Math.max(0, (state.replyIdx[agent] || 0) + Number(d.reply)));
    render(true);
    return;
  }
  if (d.key) {
    const agent = document.querySelector('.scard[aria-current="true"]').dataset.session;
    const s = DATA.sessions[agent];
    if ((s.state === 'permission' || s.state === 'question') && ['1', '2', 'Enter'].includes(d.key)) {
      s.state = 'working'; s.label = 'working'; s.since = 'now';
      s.last = agent !== 'mobile' ? 'Bash: npm run e2e -- checkout (allowed)'
        : d.key === '2' ? 'Answered: the key-value store' : 'Answered: SQLite';
      s.screen = '● Working…';
      DATA.groups.forEach((g) => { g[1] = g[1].filter((x) => x !== agent); });
      DATA.groups[2][1].unshift(agent);
      render(true);
      toast(`Sent ${d.key}. In the real app the key goes to the session’s terminal, and it starts working again.`);
    } else toast(`In the real app this sends the key ${d.key} to the session’s terminal.`);
    return;
  }
  if (d.notice) {
    const n = DATA.notices.find((x) => x.id === d.notice);
    go('sessions/new', true);
    state.prefill = { project: n.project, prompt: n.prompt };
    render();
    return;
  }
  if (d.dismiss) { state.dismissed.add(d.dismiss); render(true); toast('Dismissed for good.'); return; }
  switch (d.act) {
    case 'timer':
      state.timer.on = !state.timer.on;
      if (state.timer.on) state.timer.started = Date.now();
      render(true);
      toast(state.timer.on ? 'Timer started.' : 'Timer stopped. Clicking a session card starts it again.');
      break;
    case 'theme': {
      const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
      setTheme(dark ? 'light' : 'dark');
      break;
    }
    case 'panel': state.panelOpen = !state.panelOpen; render(true); break;
    case 'type': {
      const box = document.querySelector('.typebox textarea');
      toast(box.value.trim() ? `In the real app “${box.value.trim().slice(0, 60)}” is pasted into the session’s terminal, then Enter.` : 'Type something first.');
      box.value = '';
      break;
    }
    case 'message': toast('In the real app this sends a triage message. The session gets it on its next step, or is woken if it’s idle.'); break;
  }
});
document.addEventListener('input', (e) => {
  if (e.target.id === 'fs') {
    state.fontPct = Number(e.target.value);
    document.documentElement.style.fontSize = state.fontPct + '%';
    document.getElementById('fsv').textContent = state.fontPct + '%';
  }
});
document.addEventListener('change', (e) => {
  if (e.target.name === 'theme') setTheme(e.target.value);
  if (e.target.id === 'notify') toast(e.target.checked ? 'In the real app this asks the browser for permission to show notifications.' : 'Notifications off.');
});
window.addEventListener('hashchange', () => go(location.hash));
window.addEventListener('popstate', () => go(location.hash));
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => render(true));
setInterval(() => { const b = document.getElementById('timer'); if (b && state.timer.on) b.innerHTML = timerLabel(); }, 30000);
go(location.hash);
</script>
